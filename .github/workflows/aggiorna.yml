# VoxViva — aggiornamento automatico del sito
#
# Cosa fa: due volte al giorno (e ogni volta che lo lanci a mano) rigira la
# pipeline — legge i feed, raggruppa le notizie con l'LLM, ricostruisce la
# pagina, genera il CSV delle card social — e pubblica su GitHub Pages.

name: Aggiorna VoxViva

on:
  # DUE giri al giorno: 06:00 e 18:00 UTC = 08:00 e 20:00 ora italiana d'estate.
  # Per cambiare: "0 6 * * *" = 1 giro | "0 6,12,18 * * *" = 3 giri.
  schedule:
    - cron: "0 6,18 * * *"
  # bottone "Run workflow" nella scheda Actions, per lanciarlo quando vuoi
  workflow_dispatch:

# permessi minimi per pubblicare su Pages
permissions:
  contents: read
  pages: write
  id-token: write

# se parte un nuovo giro mentre il precedente non ha finito, l'ultimo vince
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  costruisci-e-pubblica:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - name: Scarica il codice
        uses: actions/checkout@v5

      - name: Prepara Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Installa le dipendenze
        run: pip install -r requirements.txt

      - name: Rigenera la pagina
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # manopole opzionali: si regolano da Settings > Variables, senza toccare il codice
          ILVAGLIO_MODEL: ${{ vars.ILVAGLIO_MODEL || 'claude-haiku-4-5' }}
          ILVAGLIO_MODEL_RAGGRUPPA: ${{ vars.ILVAGLIO_MODEL_RAGGRUPPA || 'claude-haiku-4-5' }}
          # Batch API: 50% di sconto. 1 = acceso, 0 = chiamate dirette (piu' veloci)
          ILVAGLIO_BATCH: ${{ vars.ILVAGLIO_BATCH || '1' }}
          ILVAGLIO_INTENSITA_ALLARME: ${{ vars.ILVAGLIO_INTENSITA_ALLARME || '1.6' }}
          ILVAGLIO_PESO_DIVERGENZA: ${{ vars.ILVAGLIO_PESO_DIVERGENZA || '14' }}
          ILVAGLIO_TETTO_USD: ${{ vars.ILVAGLIO_TETTO_USD || '0' }}
          ILVAGLIO_SOGLIA_DIVERGENZA: ${{ vars.ILVAGLIO_SOGLIA_DIVERGENZA || '0.65' }}
          ILVAGLIO_MAX_SOCIAL: ${{ vars.ILVAGLIO_MAX_SOCIAL || '2' }}
        run: |
          python ingest.py --ore 24
          python cluster.py
          python render.py --max 15
          python genera_social.py

      - name: Configura Pages
        uses: actions/configure-pages@v5

      - name: Carica il sito
        uses: actions/upload-pages-artifact@v5
        with:
          path: web

      - name: Pubblica su Pages
        id: deploy
        uses: actions/deploy-pages@v5
