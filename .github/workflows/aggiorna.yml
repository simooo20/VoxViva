# VoxViva — aggiornamento automatico del sito.
#
# Cosa fa: due volte al giorno (e ogni volta che lo lanci a mano) rigira la
# pipeline — legge i feed, raggruppa le notizie con l'LLM, ricostruisce la
# pagina — e pubblica su GitHub Pages.

name: Aggiorna VoxViva

on:
  # DUE giri al giorno, ~07:40 e ~19:40 ora italiana d'estate (05:40 e 17:40 UTC).
  # 28/9: il giro delle 18:00 UTC in punto non e' partito e quello delle 06:00
  # e' partito con 7 ore di ritardo: GitHub rimanda o salta i cron all'ora
  # esatta quando e' sovraccarico. Minuti "strani" (:40) = molti meno ritardi.
  # RISERVA: alle :10 dell'ora dopo parte un secondo cron che si ferma subito
  # (costo zero) se il sito e' gia' stato aggiornato nelle ultime 4 ore.
  schedule:
    - cron: "40 5,17 * * *"
    - cron: "10 7,19 * * *"
  # bottone "Run workflow" nella scheda Actions, per lanciarlo quando vuoi
  workflow_dispatch:
    inputs:
      veloce:
        description: "Veloce: chiamate dirette invece della coda batch (costa il doppio, finisce in pochi minuti)"
        type: boolean
        default: false

# permessi minimi per pubblicare su Pages
permissions:
  contents: read
  pages: write
  id-token: write


# se parte un nuovo giro mentre il precedente non ha finito, l'ultimo vince
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  costruisci-e-pubblica:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - name: Serve un giro? (la riserva salta se il sito e' fresco)
        id: serve
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, urllib.request, time
          from datetime import datetime, timezone
          evento = "${{ github.event_name }}"
          cron = "${{ github.event.schedule }}"
          salta = False
          if evento == "schedule" and cron.startswith("10 "):
              try:
                  url = "https://voxviva.xyz/stato.json?v=%d" % int(time.time())
                  d = json.load(urllib.request.urlopen(url, timeout=15))
                  eta = datetime.now(timezone.utc) - datetime.fromisoformat(d["generato"].replace("Z", "+00:00"))
                  salta = eta.total_seconds() < 4 * 3600
              except Exception:
                  salta = False
          print("salta=%s" % ("si" if salta else "no"))
          PY

      - name: Scarica il codice
        if: steps.serve.outputs.salta != 'si'
        uses: actions/checkout@v5

      - name: Prepara Python
        if: steps.serve.outputs.salta != 'si'
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Installa le dipendenze
        if: steps.serve.outputs.salta != 'si'
        run: pip install -r requirements.txt

      # Se il giro fallisce il sito resta all'ultima versione e il workflow
      # NON diventa rosso (niente mail "Run failed" di GitHub): il problema
      # resta scritto nel riepilogo del giro (passo dopo).
      - name: Rigenera la pagina
        id: rigenera
        if: steps.serve.outputs.salta != 'si'
        continue-on-error: true
        env:
          PYTHONUNBUFFERED: "1"
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # manopole opzionali: si regolano da Settings > Variables, senza toccare il codice
          ILVAGLIO_MODEL: ${{ vars.ILVAGLIO_MODEL || 'claude-haiku-4-5' }}
          ILVAGLIO_MODEL_RAGGRUPPA: ${{ vars.ILVAGLIO_MODEL_RAGGRUPPA || 'claude-haiku-4-5' }}
          # Batch API: 50% di sconto. 1 = acceso, 0 = chiamate dirette (piu' veloci)
          ILVAGLIO_BATCH: ${{ inputs.veloce && '0' || vars.ILVAGLIO_BATCH || '1' }}
          ILVAGLIO_INTENSITA_ALLARME: ${{ vars.ILVAGLIO_INTENSITA_ALLARME || '1.6' }}
          ILVAGLIO_PESO_DIVERGENZA: ${{ vars.ILVAGLIO_PESO_DIVERGENZA || '14' }}
          ILVAGLIO_TETTO_USD: ${{ vars.ILVAGLIO_TETTO_USD || '1.50' }}   # tetto di spesa al giorno (USD): oltre, resta online l'ultima versione
          ILVAGLIO_SOGLIA_DIVERGENZA: ${{ vars.ILVAGLIO_SOGLIA_DIVERGENZA || '0.65' }}
          ILVAGLIO_MAX_SOCIAL: ${{ vars.ILVAGLIO_MAX_SOCIAL || '2' }}
        run: |
          set -o pipefail
          { python ingest.py --ore 24 && python cluster.py && python render.py --max 15; } 2>&1 | tee giro.log

      # Nessuna mail (richiesta di Simone, 31/10): i problemi restano scritti
      # solo nella pagina del giro su GitHub (riepilogo + avvisi gialli).
      # Nessun commento sulla segnalazione #1, che non viene piu' toccata.
      - name: Riepilogo del giro (senza mail)
        if: always() && steps.serve.outputs.salta != 'si'
        continue-on-error: true
        env:
          ESITO: ${{ steps.rigenera.outcome }}
        run: |
          if [ "$ESITO" != "success" ]; then
            ULTIMA=$(tail -n 1 giro.log 2>/dev/null | sed -E 's/sk-ant-[A-Za-z0-9_-]+/sk-ant-***/g; s/%/%25/g' | cut -c1-300)
            echo "::warning::Giro non riuscito, il sito resta fermo. Ultima riga del log: $ULTIMA"
            { echo "### Giro non riuscito: il sito resta fermo"; echo; echo '```'
              tail -n 30 giro.log 2>/dev/null | sed -E 's/sk-ant-[A-Za-z0-9_-]+/sk-ant-***/g'
              echo '```'; } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          python - <<'PY2'
          import json, os
          try:
              a = json.load(open("web/stato.json")).get("allarmi") or []
          except Exception as e:
              a = ["stato.json non leggibile: %s" % e]
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
              if not a:
                  f.write("### Giro riuscito, nessun allarme di qualita'\n")
              else:
                  f.write("### Giro riuscito, allarmi di qualita'\n\n")
                  for x in a:
                      f.write("- %s\n" % x)
                      print("::warning::%s" % x.replace("\n", " "))
          PY2

      - name: Configura Pages
        if: steps.serve.outputs.salta != 'si' && steps.rigenera.outcome == 'success'
        uses: actions/configure-pages@v5

      - name: Carica il sito
        if: steps.serve.outputs.salta != 'si' && steps.rigenera.outcome == 'success'
        uses: actions/upload-pages-artifact@v5
        with:
          path: web

      - name: Pubblica su Pages
        if: steps.serve.outputs.salta != 'si' && steps.rigenera.outcome == 'success'
        id: deploy
        uses: actions/deploy-pages@v5
