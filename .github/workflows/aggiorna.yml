# Il Vaglio — aggiornamento automatico del sito
#
# Cosa fa: ogni 30 minuti (e ogni volta che lo lanci a mano) rigira la
# pipeline — legge i feed, raggruppa le notizie con l'LLM, ricostruisce
# la pagina — e pubblica il risultato su GitHub Pages.
#
# Il visitatore vede sempre un sito normale, sempre aggiornato: il lavoro
# avviene qui dietro, non sul suo schermo.

name: Aggiorna VoxViva

on:
  # MODALITA' ECONOMICA: 4 giri al giorno, alle 00:00 / 06:00 / 12:00 / 18:00
  # ORA ITALIANA (estate). GitHub usa UTC, quindi qui sono 22/04/10/16.
  # In inverno (ora solare) scaleranno di un'ora in Italia: 23/05/11/17. Va bene lo stesso.
  # Per cambiare cadenza: "0 22,4,10,16 * * *" = 4 volte | "0 */3 * * *" = ogni 3h.
  schedule:
    - cron: "0 22,4,10,16 * * *"
  # bottone "Run workflow" nella scheda Actions, per lanciarlo quando vuoi
  workflow_dispatch:

# permessi minimi per pubblicare su Pages
permissions:
  contents: read
  pages: write
  id-token: write

# se parte un nuovo giro mentre il precedente non ha finito, l'ultimo vince
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  costruisci-e-pubblica:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - name: Scarica il codice
        uses: actions/checkout@v4

      - name: Prepara Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installa le dipendenze
        run: pip install -r requirements.txt

      - name: Rigenera la pagina
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # opzionale: cambia il modello senza toccare il codice
          ILVAGLIO_MODEL: ${{ vars.ILVAGLIO_MODEL || 'claude-haiku-4-5' }}
        run: |
          python ingest.py --ore 24
          python cluster.py
          python render.py --max 15

      - name: Configura Pages
        uses: actions/configure-pages@v5

      - name: Carica il sito
        uses: actions/upload-pages-artifact@v3
        with:
          path: web

      - name: Pubblica su Pages
        id: deploy
        uses: actions/deploy-pages@v4
