# VoxViva — aggiornamento automatico del sito
#
# Cosa fa: due volte al giorno (e ogni volta che lo lanci a mano) rigira la
# pipeline — legge i feed, raggruppa le notizie con l'LLM, ricostruisce la
# pagina — e pubblica su GitHub Pages.

name: Aggiorna VoxViva

on:
  # DUE giri al giorno: 06:00 e 18:00 UTC = 08:00 e 20:00 ora italiana d'estate.
  # Per cambiare: "0 6 * * *" = 1 giro | "0 6,12,18 * * *" = 3 giri.
  schedule:
    - cron: "0 6,18 * * *"
  # bottone "Run workflow" nella scheda Actions, per lanciarlo quando vuoi
  workflow_dispatch:
    inputs:
      veloce:
        description: "Veloce: chiamate dirette invece della coda batch (costa il doppio, finisce in pochi minuti)"
        type: boolean
        default: false

# permessi minimi per pubblicare su Pages
permissions:
  contents: read
  pages: write
  id-token: write
  issues: write     # per la segnalazione automatica dei problemi di qualita'


# se parte un nuovo giro mentre il precedente non ha finito, l'ultimo vince
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  costruisci-e-pubblica:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - name: Scarica il codice
        uses: actions/checkout@v5

      - name: Prepara Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Installa le dipendenze
        run: pip install -r requirements.txt

      - name: Rigenera la pagina
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # manopole opzionali: si regolano da Settings > Variables, senza toccare il codice
          ILVAGLIO_MODEL: ${{ vars.ILVAGLIO_MODEL || 'claude-haiku-4-5' }}
          ILVAGLIO_MODEL_RAGGRUPPA: ${{ vars.ILVAGLIO_MODEL_RAGGRUPPA || 'claude-haiku-4-5' }}
          # Batch API: 50% di sconto. 1 = acceso, 0 = chiamate dirette (piu' veloci)
          ILVAGLIO_BATCH: ${{ inputs.veloce && '0' || vars.ILVAGLIO_BATCH || '1' }}
          ILVAGLIO_INTENSITA_ALLARME: ${{ vars.ILVAGLIO_INTENSITA_ALLARME || '1.6' }}
          ILVAGLIO_PESO_DIVERGENZA: ${{ vars.ILVAGLIO_PESO_DIVERGENZA || '14' }}
          ILVAGLIO_TETTO_USD: ${{ vars.ILVAGLIO_TETTO_USD || '1.00' }}   # tetto di spesa al giorno (USD): oltre, resta online l'ultima versione
          ILVAGLIO_SOGLIA_DIVERGENZA: ${{ vars.ILVAGLIO_SOGLIA_DIVERGENZA || '0.65' }}
          ILVAGLIO_MAX_SOCIAL: ${{ vars.ILVAGLIO_MAX_SOCIAL || '2' }}
        run: |
          python ingest.py --ore 24
          python cluster.py
          python render.py --max 15

      # Controllo qualita': se render.py ha trovato problemi (confronti senza
      # divergenza, pochi confronti, sport, titoli di ore diverse) apre o
      # aggiorna la segnalazione "Controllo qualita' VoxViva" su GitHub: arriva
      # per email. Non blocca mai la pubblicazione.
      - name: Segnala problemi di qualita'
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY' > allarmi.txt
          import json
          try:
              a = json.load(open("web/stato.json")).get("allarmi") or []
          except Exception as e:
              a = ["stato.json non leggibile: %s" % e]
          if a: print("\n".join("- " + x for x in a))
          PY
          if [ -s allarmi.txt ]; then
            N=$(gh issue list --state open --search "Controllo qualita VoxViva in:title" --json number -q '.[0].number')
            TESTO="$(date -u '+%Y-%m-%d %H:%M UTC') - giro ${{ github.run_number }}"$'\n\n'"$(cat allarmi.txt)"
            if [ -n "$N" ]; then gh issue comment "$N" --body "$TESTO"; else gh issue create --title "Controllo qualita VoxViva" --body "$TESTO"; fi
          else
            echo "Nessun problema di qualita'."
          fi

      - name: Configura Pages
        uses: actions/configure-pages@v5

      - name: Carica il sito
        uses: actions/upload-pages-artifact@v5
        with:
          path: web

      - name: Pubblica su Pages
        id: deploy
        uses: actions/deploy-pages@v5
