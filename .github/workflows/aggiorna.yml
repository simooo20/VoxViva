name: Aggiorna VoxViva

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  costruisci-e-pubblica:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    defaults:
      run:
        working-directory: VoxViva-da-caricare
    steps:
      - name: Scarica il codice
        uses: actions/checkout@v4

      - name: Prepara Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installa le dipendenze
        run: pip install -r requirements.txt

      - name: Rigenera la pagina
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ILVAGLIO_MODEL: ${{ vars.ILVAGLIO_MODEL || 'claude-sonnet-4-5' }}
        run: |
          python ingest.py --ore 24
          python cluster.py --leggi-articoli
          python render.py --max 15

      - name: Configura Pages
        uses: actions/configure-pages@v5

      - name: Carica il sito
        uses: actions/upload-pages-artifact@v3
        with:
          path: VoxViva-da-caricare/web

      - name: Pubblica su Pages
        id: deploy
        uses: actions/deploy-pages@v4
