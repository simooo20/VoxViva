# Sonda sitemap — usa e getta
#
# A che serve: vedere quali testate bloccate sull'RSS si possono recuperare
# dalla loro news sitemap (quella con i titoli). NON tocca il sito ne' la
# pipeline: gira, stampa il verdetto nel log, e finisce.
#
# Come si usa: scheda "Actions" -> "Sonda sitemap" (nella colonna a sinistra)
# -> bottone "Run workflow". Puoi lasciare i domini di default o scriverne altri
# separati da spazio. Poi apri il run e leggi il log del passo "Lancia la sonda".
#
# Perche' qui e non sul PC: il blocco anti-bot dipende dall'IP, e questo job
# gira dallo stesso tipo di IP della pipeline vera. Il risultato che vedi qui
# e' quello che conta.

name: Sonda sitemap

on:
  workflow_dispatch:
    inputs:
      domini:
        description: "Domini separati da spazio (vuoto = quelli in sources.json)"
        required: false
        default: "corriere.it ilgiornale.it adnkronos.com ilmessaggero.it fanpage.it huffingtonpost.it ilpost.it internazionale.it"
      ore:
        description: "Finestra in ore per i titoli recenti"
        required: false
        default: "24"

permissions:
  contents: read

jobs:
  sonda:
    runs-on: ubuntu-latest
    steps:
      - name: Scarica il codice
        uses: actions/checkout@v4

      - name: Prepara Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Lancia la sonda
        # I valori del bottone passano da variabili d'ambiente (non incollati
        # nel comando): cosi' niente sorprese se qualcuno scrive strano.
        # $DOMINI senza virgolette si spezza da solo nei singoli domini.
        env:
          DOMINI: ${{ inputs.domini }}
          ORE: ${{ inputs.ore }}
        run: python check_sitemap.py --ore "$ORE" $DOMINI
